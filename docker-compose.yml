services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aye
      POSTGRES_USER: aye
      POSTGRES_PASSWORD: aye
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aye -d aye"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      AYE_DATABASE_URL: postgresql+psycopg://aye:aye@db:5432/aye
      AYE_CORS_ORIGINS: http://localhost:3000
      AYE_API_TOKEN: ${AYE_API_TOKEN:?Set AYE_API_TOKEN in the root .env file}
      AYE_RSS_FEED_URLS: ${AYE_RSS_FEED_URLS:-}
      AYE_MAX_PRODUCTION_ATTEMPTS: ${AYE_MAX_PRODUCTION_ATTEMPTS:-3}
      AYE_PRODUCTION_STALE_AFTER_SECONDS: ${AYE_PRODUCTION_STALE_AFTER_SECONDS:-21600}
      AYE_MEDIA_DIR: /data/media
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - aye_media:/data/media
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      AYE_DATABASE_URL: postgresql+psycopg://aye:aye@db:5432/aye
      AYE_MAX_PRODUCTION_ATTEMPTS: ${AYE_MAX_PRODUCTION_ATTEMPTS:-3}
      AYE_PRODUCTION_STALE_AFTER_SECONDS: ${AYE_PRODUCTION_STALE_AFTER_SECONDS:-21600}
      AYE_WORKER_POLL_SECONDS: ${AYE_WORKER_POLL_SECONDS:-2}
      AYE_MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - aye_media:/data/media
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  aye_media:
