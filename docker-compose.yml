services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aye
      POSTGRES_USER: aye
      POSTGRES_PASSWORD: aye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aye -d aye"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      AYE_DATABASE_URL: postgresql+psycopg://aye:aye@db:5432/aye
      AYE_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
