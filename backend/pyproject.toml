[project]
name = "aye-api"
version = "0.1.0"
description = "Autonomous YouTube Engine API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "feedparser>=6.0,<7.0",
  "Pillow>=10,<13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = false
